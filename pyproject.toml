[project]
name = "fsagent"
version = "0.1.0"
description = "Fast/plan runtime extension for Deep Agents."
requires-python = ">=3.11,<4.0"
dependencies = [
    "deepagents",
    "deepagents-cli",
    "fastapi>=0.115.0,<1.0.0",
    "langchain>=1.2.17,<2.0.0",
    "langchain-core>=1.3.2,<2.0.0",
    "langchain-mcp-adapters",
    "langchain-qwq",
    "langgraph",
    "uvicorn[standard]>=0.32.0,<1.0.0",
]

[project.scripts]
fsagent = "fsagent.cli:main"
fsagent-api = "fsagent.api.server:main"
fsagent-dev = "fsagent.dev:main"

[tool.uv.sources]
deepagents = { path = "../../libs/deepagents", editable = true }
deepagents-cli = { path = "../../libs/cli", editable = true }

[dependency-groups]
test = [
    "pytest",
    "pytest-asyncio",
    "ruff>=0.12.2,<0.16.0",
]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fsagent*"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.ruff]
line-length = 120

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "ISC001",
    "PLR0913",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"fsagent/tests/**" = [
    "ANN001",
    "ANN201",
    "D1",
    "PLR2004",
    "RUF001",
    "S101",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
